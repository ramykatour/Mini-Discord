<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ChatRoom — Register</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',sans-serif;background:#111214;color:#dcddde;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 70% 20%, rgba(88,101,242,0.15) 0%, transparent 60%),radial-gradient(ellipse at 20% 80%, rgba(87,242,135,0.08) 0%, transparent 60%);pointer-events:none;}
.card{background:#1e1f22;border-radius:16px;padding:40px;width:100%;max-width:440px;border:1px solid #2b2d31;position:relative;z-index:1;}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
.logo-icon{width:48px;height:48px;background:linear-gradient(135deg,#5865F2,#7b89f5);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.logo h1{font-size:22px;font-weight:700;color:#fff;}
h2{font-size:24px;font-weight:700;color:#fff;margin-bottom:8px;}
.sub{color:#949ba4;font-size:14px;margin-bottom:28px;}
.field{margin-bottom:18px;}
label{display:block;font-size:13px;font-weight:600;color:#b5bac1;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
input{width:100%;background:#2b2d31;border:1.5px solid #3f4147;border-radius:8px;padding:12px 14px;color:#fff;font-size:15px;font-family:inherit;outline:none;transition:border-color .2s;}
input:focus{border-color:#5865F2;}
input::placeholder{color:#5c5f66;}
.btn{width:100%;padding:13px;border-radius:8px;border:none;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;}
.btn-primary{background:#5865F2;color:#fff;}
.btn-primary:hover{background:#4752c4;}
.btn-google{background:#2b2d31;color:#fff;border:1.5px solid #3f4147;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;}
.btn-google:hover{background:#35373c;border-color:#5865F2;}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#5c5f66;font-size:13px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#3f4147;}
.links{text-align:center;margin-top:20px;font-size:14px;color:#949ba4;}
.links a{color:#5865F2;text-decoration:none;font-weight:600;}
.error{background:rgba(237,66,69,.15);border:1px solid rgba(237,66,69,.4);border-radius:8px;padding:12px;color:#ed4245;font-size:14px;margin-bottom:16px;display:none;}
.success{background:rgba(87,242,135,.12);border:1px solid rgba(87,242,135,.3);border-radius:8px;padding:12px;color:#57f287;font-size:14px;margin-bottom:16px;display:none;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="logo">
    <div class="logo-icon">💬</div>
    <h1>ChatRoom</h1>
  </div>
  <h2>Create an account</h2>
  <p class="sub">Join the conversation today</p>
  <div class="error" id="error"></div>
  <div class="success" id="success"></div>
  <form id="regForm">
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="cooluser123" maxlength="32" required/>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min. 6 characters" required/>
    </div>
    <button type="submit" class="btn btn-primary">Create Account</button>
  </form>
  <div class="divider">or</div>
  <button class="btn btn-google" onclick="location.href='/auth/google'">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Sign up with Google
  </button>
  <div class="links">Already have an account? <a href="/login">Sign in</a></div>
</div>
<script>
document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('error');
  const ok  = document.getElementById('success');
  err.style.display = ok.style.display = 'none';
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  try {
    const res = await fetch('/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error; err.style.display = 'block'; return; }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    ok.textContent = 'Account created! Redirecting...';
    ok.style.display = 'block';
    setTimeout(() => location.href = '/', 1000);
  } catch (e) {
    err.textContent = 'Connection error'; err.style.display = 'block';
  }
});
</script>
</body>
</html>
