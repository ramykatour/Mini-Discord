<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChatRoom — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Space Grotesk', sans-serif;
  background: #111214;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.bg-blobs {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
}
.blob {
  position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15;
}
.blob-1 { width: 500px; height: 500px; background: #5865F2; top: -100px; left: -100px; animation: float1 8s ease-in-out infinite; }
.blob-2 { width: 400px; height: 400px; background: #EB459E; bottom: -100px; right: -100px; animation: float2 10s ease-in-out infinite; }
.blob-3 { width: 300px; height: 300px; background: #57F287; top: 50%; left: 50%; transform: translate(-50%,-50%); animation: float3 7s ease-in-out infinite; }
@keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,20px)} }
@keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-20px,30px)} }
@keyframes float3 { 0%,100%{transform:translate(-50%,-50%)} 50%{transform:translate(-45%,-55%)} }

.card {
  position: relative; z-index: 1;
  background: rgba(30,31,34,0.9);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 40px;
  width: 420px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.5);
}
.logo { text-align: center; margin-bottom: 28px; }
.logo-icon { font-size: 40px; color: #5865F2; margin-bottom: 8px; }
.logo h1 { font-size: 24px; font-weight: 700; color: #fff; }
.logo p { color: #949ba4; font-size: 14px; margin-top: 4px; }

.tabs { display: flex; background: #1e1f22; border-radius: 10px; padding: 4px; margin-bottom: 24px; }
.tab {
  flex: 1; padding: 8px; text-align: center; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 500; color: #949ba4; transition: all 0.2s;
}
.tab.active { background: #5865F2; color: #fff; }

.form-group { margin-bottom: 16px; }
label { display: block; font-size: 12px; font-weight: 600; color: #b5bac1; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
input {
  width: 100%; background: #1e1f22; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; padding: 12px 14px; color: #f2f3f5; font-size: 14px;
  font-family: inherit; outline: none; transition: border 0.2s;
}
input:focus { border-color: #5865F2; }
input::placeholder { color: #4e5058; }

.btn {
  width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 15px; font-weight: 600; font-family: inherit; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary { background: #5865F2; color: white; }
.btn-primary:hover { background: #4752c4; transform: translateY(-1px); }
.btn-google { background: #fff; color: #333; margin-bottom: 12px; }
.btn-google:hover { background: #f5f5f5; transform: translateY(-1px); }
.btn-guest { background: transparent; color: #949ba4; border: 1px solid rgba(255,255,255,0.1); margin-top: 8px; }
.btn-guest:hover { background: rgba(255,255,255,0.05); color: #dcddde; }

.divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: #4e5058; font-size: 12px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.08); }

.error-msg { background: rgba(237,66,69,0.15); border: 1px solid rgba(237,66,69,0.3); color: #ed4245; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
.error-msg.show { display: block; }

.panel { display: none; }
.panel.active { display: block; }
</style>
</head>
<body>
<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="card">
  <div class="logo">
    <div class="logo-icon"><i class="ti ti-brand-discord"></i></div>
    <h1>ChatRoom</h1>
    <p>Connect, chat, and hang out</p>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">Sign In</div>
    <div class="tab" onclick="switchTab('register')">Register</div>
  </div>

  <div id="error-box" class="error-msg"></div>

  <!-- LOGIN -->
  <div id="panel-login" class="panel active">
    <button class="btn btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.5 30.2 0 24 0 14.7 0 6.7 5.4 2.7 13.3l7.9 6.1C12.5 13.2 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8C43.6 37.4 46.5 31.4 46.5 24.5z"/><path fill="#FBBC05" d="M10.6 28.6A14.7 14.7 0 0 1 9.5 24c0-1.6.3-3.2.7-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.5 10.8l8.1-6.2z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2.1 1.4-4.7 2.2-7.7 2.2-6.2 0-11.5-4.2-13.4-9.9l-8.1 6.2C6.7 42.6 14.7 48 24 48z"/></svg>
      Continue with Google
    </button>
    <div class="divider">or</div>
    <div class="form-group">
      <label>Email</label>
      <input id="login-email" type="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="login-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()" />
    </div>
    <button class="btn btn-primary" onclick="doLogin()">
      <i class="ti ti-login"></i> Sign In
    </button>
    <button class="btn btn-guest" onclick="doGuest()">
      <i class="ti ti-user-question"></i> Continue as Guest
    </button>
  </div>

  <!-- REGISTER -->
  <div id="panel-register" class="panel">
    <button class="btn btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5.0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.5 30.2 0 24 0 14.7 0 6.7 5.4 2.7 13.3l7.9 6.1C12.5 13.2 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8C43.6 37.4 46.5 31.4 46.5 24.5z"/><path fill="#FBBC05" d="M10.6 28.6A14.7 14.7 0 0 1 9.5 24c0-1.6.3-3.2.7-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.5 10.8l8.1-6.2z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2.1 1.4-4.7 2.2-7.7 2.2-6.2 0-11.5-4.2-13.4-9.9l-8.1 6.2C6.7 42.6 14.7 48 24 48z"/></svg>
      Sign up with Google
    </button>
    <div class="divider">or</div>
    <div class="form-group">
      <label>Username</label>
      <input id="reg-username" type="text" placeholder="cooluser123" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input id="reg-email" type="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="reg-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doRegister()" />
    </div>
    <button class="btn btn-primary" onclick="doRegister()">
      <i class="ti ti-user-plus"></i> Create Account
    </button>
    <button class="btn btn-guest" onclick="doGuest()">
      <i class="ti ti-user-question"></i> Continue as Guest
    </button>
  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('panel-login').classList.toggle('active', tab==='login');
  document.getElementById('panel-register').classList.toggle('active', tab==='register');
  hideError();
}
function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = msg; el.classList.add('show');
}
function hideError() {
  document.getElementById('error-box').classList.remove('show');
}
async function apiPost(url, body) {
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  return r.json();
}
function saveAndRedirect(data) {
  if (data.error) return showError(data.error);
  localStorage.setItem('cr_token', data.token);
  localStorage.setItem('cr_user', JSON.stringify(data.user));
  window.location.href = '/';
}
async function doLogin() {
  hideError();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  if (!email || !password) return showError('Please fill all fields');
  const data = await apiPost('/auth/login', { email, password });
  saveAndRedirect(data);
}
async function doRegister() {
  hideError();
  const username = document.getElementById('reg-username').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-pass').value;
  if (!username || !email || !password) return showError('Please fill all fields');
  const data = await apiPost('/auth/register', { username, email, password });
  saveAndRedirect(data);
}
async function doGuest() {
  hideError();
  const data = await apiPost('/auth/guest', {});
  saveAndRedirect(data);
}
function loginGoogle() {
  window.location.href = '/auth/google';
}
// Handle Google OAuth token from URL
const urlToken = new URLSearchParams(location.search).get('token');
if (urlToken) {
  fetch('/auth/me', { headers:{ Authorization: `Bearer ${urlToken}` }})
    .then(r=>r.json()).then(data => {
      if (data.user) {
        localStorage.setItem('cr_token', urlToken);
        localStorage.setItem('cr_user', JSON.stringify(data.user));
        window.location.href = '/';
      }
    });
}
// Already logged in?
const existingToken = localStorage.getItem('cr_token');
if (existingToken) {
  fetch('/auth/me', { headers:{ Authorization: `Bearer ${existingToken}` }})
    .then(r=>r.json()).then(data => { if (data.user) window.location.href = '/'; });
}
</script>
</body>
</html>
